{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ product.photo | media_filter }}">
                    <div class="card-body">
                        <p class="card-text text-primary">{{ object.name }}</p>
                        <p class="card-text text-danger-emphasis">{{ object.category}}</p>
                        <p class="card-text text-danger">{{ object.price }} за кг.</p>
                        <p class="card-text text-success">Дата упакования: {{ object.created_at }}.</p>
                        <p class="card-text">{{ object.description }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <button type="button" class="btn btn-sm btn-outline-secondary bg-primary text-white">
                                    Купить
                                </button>
                                <a href="{% url 'catalog:product_list' %}" type="button" class="btn btn-sm btn-outline-secondary bg-primary text-white">
                                    Назад
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
